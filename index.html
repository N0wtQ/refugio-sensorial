<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/fav.png" />
  <link rel="apple-touch-icon" href="/fav.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme -->
  <meta name="theme-color" content="#0C0E1E" />

  <!-- Primary meta -->
  <title>Refugio Sensorial — Recursos para personas neurodivergentes</title>
  <meta name="description" content="Mapa de sitios silenciosos y herramientas digitales para personas neurodivergentes en España. TEA, TDAH, Dislexia, TOC." />
  <meta name="author" content="Almudena Bedoya" />
  <meta name="robots" content="index, follow" />

  <!-- CSP parcial via meta (frame-ancestors y HSTS requieren Cloudflare para funcionar) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com 'unsafe-inline';
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
    img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.cartocdn.com https://*.basemaps.cartocdn.com https://n0wtq.github.io https://media1.giphy.com;
    media-src 'self';
    connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://formspree.io https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  " />

  <!-- Open Graph / WhatsApp / redes sociales -->
  <meta property="og:type"         content="website" />
  <meta property="og:url"          content="https://www.refugio-sensorial.com/" />
  <meta property="og:title"        content="Refugio Sensorial — Recursos para personas neurodivergentes" />
  <meta property="og:description"  content="Mapa de sitios silenciosos, herramientas digitales y apoyo en crisis para personas neurodivergentes en España." />
  <meta property="og:image"        content="https://www.refugio-sensorial.com/og/default.png" />
  <meta property="og:image:alt"    content="Refugio Sensorial: recursos para personas neurodivergentes" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale"       content="es_ES" />
  <meta property="og:site_name"    content="Refugio Sensorial" />

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Refugio Sensorial — Recursos para personas neurodivergentes" />
  <meta name="twitter:description" content="Mapa de sitios silenciosos, herramientas digitales y apoyo en crisis para personas neurodivergentes en España." />
  <meta name="twitter:image"       content="https://www.refugio-sensorial.com/og/default.png" />
  <meta name="twitter:image:alt"   content="Refugio Sensorial: recursos para personas neurodivergentes" />

  <!-- Datos estructurados Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://www.refugio-sensorial.com/#website",
        "name": "Refugio Sensorial",
        "url": "https://www.refugio-sensorial.com/",
        "description": "Recursos digitales para personas neurodivergentes en España: mapa de lugares silenciosos, herramientas para TEA y TDAH, y apoyo en crisis.",
        "inLanguage": "es-ES",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.refugio-sensorial.com/herramientas?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://www.refugio-sensorial.com/#organization",
        "name": "Refugio Sensorial",
        "url": "https://www.refugio-sensorial.com/",
        "description": "Proyecto independiente de recursos digitales para personas neurodivergentes en España.",
        "inLanguage": "es-ES",
        "founder": {
          "@type": "Person",
          "name": "Almudena Bedoya"
        },
        "audience": {
          "@type": "Audience",
          "audienceType": "Personas con TEA, TDAH, TOC, Dislexia y otras neurodivergencias"
        }
      }
    ]
  }
  </script>

  <script src="/404-redirect.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fuentes e iconos sin bloquear el pintado -->
  <script src="/async-styles.js" defer></script>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  </noscript>
</head>
<body style="background:#0C0E1E;color:#E5E7EB;margin:0">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
